services:
  db:
    image: postgres:17
    container_name: restaurant-ai-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: restaurant_ai
      POSTGRES_USER: restaurant_ai_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - restaurant_ai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_ai_user -d restaurant_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: restaurant-ai-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://restaurant_ai_user:${DB_PASSWORD}@db:5432/restaurant_ai
    depends_on:
      db:
        condition: service_healthy
  


volumes:
  restaurant_ai_postgres_data:


  